buffet.add_section_text_placeholder: "Section text (max 500 characters)"
buffet.add_section_btn: "+ Add section"
buffet.explanation_intro: >
  Your card has three areas. Use the tabs above to fill them in.
buffet.explanation_infobox_title: "Infobox (right)"
buffet.explanation_infobox_body: >
  Profile picture, home location, edit count, user rights and userboxes.
  This information is shown in the column on the right side of the card.
buffet.explanation_content_title: "Content (centre)"
buffet.explanation_content_body: >
  A short biography (~50–80 words), optional images, and extra sections (~30–50 words each).
  One or two extra sections fit comfortably on the card.
buffet.explanation_accomplishments_title: "Accomplishments (bottom)"
buffet.explanation_accomplishments_body: >
  Articles or files you are proud of, barnstars you have received,
  and achievement badges based on your editing history.

