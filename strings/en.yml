gather.queue_position_many: "You are at position 5 or later in the queue."
gather.llm_consent_title: "Want AI suggestions?"
gather.llm_consent_body: >
  We can analyse your user page with Mistral AI (EU servers) to generate
  extra suggestions for your card, such as interests and language skills.
  Your wiki text (max. 50,000 characters per wiki) will be sent to Mistral for this purpose.
  You can withdraw this consent later via your card settings.
gather.llm_consent_yes: "Yes, use AI analysis"
gather.llm_consent_no: "No, skip AI analysis"
gather.start: Collect data

