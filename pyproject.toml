[project]
name = "wall-of-faces"
version = "0.1.0"
description = "Wikimedia community event profile card tool"
requires-python = "==3.11.*"

dependencies = [
    # Web framework
    "flask>=3.1",
    "flask-sqlalchemy>=3.1",
    "flask-session>=0.8",

    # Database
    "flask-migrate>=4.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pymysql>=1.1",        # MySQL driver for Toolforge

    # PDF rendering
    "weasyprint>=62",
    "pypdf>=4.0",

    # LLM
    "mistralai>=1.0",

    # Templating / i18n
    "pyyaml>=6.0",

    # HTML sanitisation
    "nh3>=0.2",

    # HTTP
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest>=9.0.2",
    "types-pyyaml>=6.0.12.20250915",
    "types-requests>=2.32.4.20260107",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.mypy]
python_version = "3.11"
strict = true
show_error_codes = true

# Third-party packages without stubs or py.typed
# sqlalchemy 2.x and requests/pyyaml have stubs — do NOT ignore them.
# Everything else lacks py.typed and must be silenced at import level.
[[tool.mypy.overrides]]
module = [
    "flask", "flask.*",
    "flask_sqlalchemy", "flask_sqlalchemy.*",
    "flask_migrate",
    "flask_session",
    "weasyprint", "weasyprint.*",
    "pypdf",
    "mistralai", "mistralai.*",
    "nh3",
    "pymysql",
    "alembic", "alembic.*",
]
ignore_missing_imports = true
