[uwsgi]
# Toolforge Kubernetes webservice — Python 3.11
# Single process with multiple threads so the background coordinator
# (gather + snapshot ThreadPoolExecutor) runs without cross-process races.

module        = wsgi:application
master        = true
processes     = 1
threads       = 8

# Sockets
http-socket   = 0.0.0.0:8000
vacuum        = true        ; remove socket on shutdown

# Logging — write to stdout so Kubernetes captures it
logto         = /dev/stdout
log-date      = true

# Lifecycle — graceful reload when sent SIGHUP
lazy-apps     = false       ; load app before forking (N/A with processes=1, but safe)
die-on-term   = true        ; SIGTERM triggers graceful shutdown, not brutal kill

# Performance tuning
buffer-size   = 65535       ; handle large OAuth callback URLs
harakiri      = 120         ; kill worker if a request takes more than 120 seconds
harakiri-verbose = true

# Static files are served by the Toolforge nginx proxy, not uWSGI.
# Do NOT add static-map here.
